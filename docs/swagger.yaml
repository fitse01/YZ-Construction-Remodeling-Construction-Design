host: localhost:8080
info:
  contact:
    email: fintech@doki.travel
    name: DOKI Fintech Engineering Team
  description: Direct Host-to-Host Bank Payment Initiation, Webhook Ingestion, and
    Atomic Ledger Reconciliation Engine for DOKI.
  title: DOKI Direct Banking & Billing Engine API
  version: "1.0"
paths:
  /v1/admin/properties/{property_id}/payments:
    get:
      description: '[READ] Paginated ledger listing for hotel accountants, filterable
        by status, bank_id, payment_method, PNR, and date range'
      parameters:
      - description: Property UUID
        in: path
        name: property_id
        required: true
        type: string
      - description: Payment Status filter (INITIATED, SETTLED, VOIDED, REFUNDED)
        in: query
        name: status
        type: string
      - description: Bank ID filter (e.g. BANK_CBE, BANK_BOA)
        in: query
        name: bank_id
        type: string
      - description: Payment Method filter (DIRECT_BANK, CASH, POS)
        in: query
        name: payment_method
        type: string
      - description: Booking PNR filter
        in: query
        name: pnr
        type: string
      - description: Reference Number filter
        in: query
        name: reference_number
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size limit (default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated ledger records
          schema:
            $ref: '#/definitions/billing.PaginatedPaymentsResponse'
        "400":
          description: Invalid property UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List and filter property payment ledger
      tags:
      - Admin
  /v1/admin/properties/{property_id}/payments/manual:
    post:
      consumes:
      - application/json
      description: '[CREATE] Records manual counter cash or terminal POS settlement
        directly into the guest folio and confirms reservation'
      parameters:
      - description: Property UUID
        in: path
        name: property_id
        required: true
        type: string
      - description: Manual payment settlement payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/billing.ManualPaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Manual payment recorded and reservation confirmed
          schema:
            $ref: '#/definitions/billing.ManualPaymentResponse'
        "400":
          description: Invalid payload
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Reservation not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Record front-desk cash or POS payment
      tags:
      - Admin
  /v1/payments/{payment_id}:
    get:
      description: '[READ] Fetch complete payment order details, PNR, payer account,
        bank reference, and ledger transaction history'
      parameters:
      - description: Payment Order UUID
        in: path
        name: payment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Payment order details
          schema:
            $ref: '#/definitions/billing.PaymentOrderDetailsResponse'
        "400":
          description: Invalid payment UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Payment order not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get payment order profile
      tags:
      - Payments
  /v1/payments/{payment_id}/refund:
    post:
      consumes:
      - application/json
      description: '[UPDATE] Issues an accounting credit and marks the transaction
        as REFUNDED, logging staff ID and justification'
      parameters:
      - description: Payment Order UUID
        in: path
        name: payment_id
        required: true
        type: string
      - description: Refund payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/billing.RefundPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Refund processed and ledgered
          schema:
            $ref: '#/definitions/billing.RefundPaymentResponse'
        "400":
          description: Invalid payload or invalid refund amount
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Payment order not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Order not settled
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Process full or partial payment refund
      tags:
      - Payments
  /v1/payments/{payment_id}/void:
    post:
      consumes:
      - application/json
      description: '[UPDATE] Cancels an open, un-settled payment order before expiry
        or if guest changes payment method'
      parameters:
      - description: Payment Order UUID
        in: path
        name: payment_id
        required: true
        type: string
      - description: Void payment justification and staff ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/billing.VoidPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Payment order voided
          schema:
            $ref: '#/definitions/billing.VoidPaymentResponse'
        "400":
          description: Invalid payload
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Payment order not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Order cannot be voided
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Void unpaid payment order
      tags:
      - Payments
  /v1/payments/initiate:
    post:
      consumes:
      - application/json
      description: '[CREATE] Generates reference_number, 6-character PNR, stay duration,
        and bank payment instructions for a held reservation'
      parameters:
      - description: Payment initiation payload containing reservation_id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/billing.InitiatePaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Payment order created successfully
          schema:
            $ref: '#/definitions/billing.InitiatePaymentResponse'
        "400":
          description: Invalid request payload or malformed UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Missing or invalid authorization token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Reservation not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Reservation not in HELD state or order already settled
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Initiate direct bank payment order
      tags:
      - Payments
  /v1/reservations/{reservation_id}/payments:
    get:
      description: '[READ] Returns the complete financial folio displaying total stay
        cost, paid amounts, outstanding balance, and transaction history'
      parameters:
      - description: Reservation UUID
        in: path
        name: reservation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Financial folio
          schema:
            $ref: '#/definitions/billing.ReservationFolioResponse'
        "400":
          description: Invalid reservation UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Reservation not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get guest reservation financial folio
      tags:
      - Folios
  /v1/reservations/{reservation_id}/payments/status:
    get:
      description: '[READ] Lightweight polling endpoint for the frontend checkout
        screen during the 15-minute hold window'
      parameters:
      - description: Reservation UUID
        in: path
        name: reservation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Payment order and reservation status
          schema:
            $ref: '#/definitions/billing.ReservationPaymentStatusResponse'
        "400":
          description: Invalid reservation UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Reservation or payment order not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Poll checkout payment status
      tags:
      - Payments
  /v1/reservations/hold:
    post:
      consumes:
      - application/json
      description: Creates a room hold reservation with hold TTL prior to payment
        initiation
      parameters:
      - description: Hold reservation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/reservation.HoldReservationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Room successfully held
          schema:
            $ref: '#/definitions/reservation.HoldReservationResponse'
        "400":
          description: Invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Missing or invalid authorization token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Hold a room for booking
      tags:
      - Reservations
  /v1/webhooks/bank/credit:
    post:
      consumes:
      - application/json
      description: '[INGEST] Direct host-to-host inbound webhook invoked by the bank
        upon guest transfer completion with paid amount, payer account, bank ID, and
        bank reference'
      parameters:
      - description: Inbound bank credit callback payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/billing.BankCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Callback acknowledged and payment reconciled
          schema:
            $ref: '#/definitions/billing.BankCallbackResponse'
        "400":
          description: Invalid webhook payload or amount mismatch
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable callback state or currency mismatch
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Inbound bank credit webhook callback
      tags:
      - Webhooks
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
