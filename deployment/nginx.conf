# Nginx configuration for YZ Construction website (yzbconstruction.com)
# Place at: /etc/nginx/sites-available/yz-construction
# Symlink: ln -sf /etc/nginx/sites-available/yz-construction /etc/nginx/sites-enabled/

# Upstream for TanStack Start SSR Frontend (Port 3000)
upstream yz_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Upstream for Express API (Port 3001)
upstream yz_api {
    server 127.0.0.1:3001;
    keepalive 64;
}

# Rate limiting zone for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yzbconstruction.com www.yzbconstruction.com;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yzbconstruction.com www.yzbconstruction.com;

    # SSL certificate paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yzbconstruction.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yzbconstruction.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max body upload size (for images/videos)
    client_max_body_size 60M;

    # Logging
    access_log /var/log/nginx/yz_construction_access.log;
    error_log /var/log/nginx/yz_construction_error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json image/svg+xml;

    # Static uploads served directly by Nginx with caching
    location /uploads/ {
        alias /var/www/yz-construction/backend/uploads/;
        
        # Cache uploaded media
        location ~* \.(jpg|jpeg|png|gif|webp|mp4|webm|svg|pdf)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
        
        # Security: prevent directory listing
        autoindex off;
    }

    # Proxy API requests to Express backend (Port 3001)
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        
        proxy_pass http://yz_api;
        proxy_http_version 1.1;
        
        # Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy all other requests to TanStack Start SSR (Port 3000)
    location / {
        proxy_pass http://yz_frontend;
        proxy_http_version 1.1;
        
        # Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
